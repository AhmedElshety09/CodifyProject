[pytest]
# pythonpath = . lets any test (even one inside runs/TC_<ID>/Automation/) reach
# the root conftest.py, so the CFG / page / reporter fixtures are always found.
# This is also what makes `cd runs && python -m pytest` work: pytest walks up
# from runs/ to find this file, sets the project root as rootdir, and loads the
# root conftest.py for every test underneath.
# importlib mode avoids duplicate-filename clashes across many run folders.
pythonpath = .
addopts = -v --tb=short --import-mode=importlib
